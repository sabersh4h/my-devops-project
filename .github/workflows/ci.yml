name: CI/CD Pipeline

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/ -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: test          # only runs if tests pass
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t my-devops-app:${{ github.sha }} .

      - name: Smoke test container
        run: |
          docker run -d -p 5000:5000 --name app my-devops-app:${{ github.sha }}
          sleep 3
          curl --fail http://localhost:5000/health
          docker stop app