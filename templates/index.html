<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DevOps Task Manager</title>
  <style>
    body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
    h1 { color: #333; }
    ul { list-style: none; padding: 0; }
    li { background: #f4f4f4; margin: 8px 0; padding: 12px; border-radius: 6px; }
    input[type=text] { padding: 8px; width: 70%; border: 1px solid #ccc; border-radius: 4px; }
    button { padding: 8px 16px; background: #0077cc; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background: #005fa3; }
    #msg { color: green; margin-top: 8px; }
  </style>
</head>
<body>
  <h1>Task Manager</h1>
  <h2>Current tasks</h2>
  <ul>
    {% for task in tasks %}
    <li>{{ task.title }} — {{ "Done" if task.done else "Pending" }}</li>
    {% endfor %}
  </ul>

  <h2>Add a task</h2>
  <input type="text" id="taskInput" placeholder="Enter task title" />
  <button onclick="addTask()">Add</button>
  <p id="msg"></p>

  <script>
    async function addTask() {
      const title = document.getElementById("taskInput").value.trim();
      if (!title) return;
      const res = await fetch("/api/tasks", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title })
      });
      if (res.ok) {
        document.getElementById("msg").textContent = "Task added! Refresh to see it.";
        document.getElementById("taskInput").value = "";
      }
    }
  </script>
</body>
</html>
